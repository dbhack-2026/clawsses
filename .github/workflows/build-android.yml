name: Build Clawsses Android APKs

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-android.yml'
      - 'phone-app/**'
      - 'glasses-app/**'
      - 'shared/**'
      - '*.gradle.kts'
      - 'gradle/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept Android SDK licenses and install platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Rokid credentials
        env:
          ROKID_CLIENT_SECRET: ${{ secrets.ROKID_CLIENT_SECRET }}
          ROKID_ACCESS_KEY: ${{ secrets.ROKID_ACCESS_KEY }}
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          if [ -n "$ROKID_CLIENT_SECRET" ] && [ -n "$ROKID_ACCESS_KEY" ]; then
            printf 'rokid.clientSecret=%s\nrokid.accessKey=%s\n' "$ROKID_CLIENT_SECRET" "$ROKID_ACCESS_KEY" >> local.properties
          else
            echo "::warning::Rokid credentials not configured. APK can be built but glasses authentication may not work."
          fi
      - name: Build phone and glasses debug APKs
        run: |
          chmod +x gradlew
          ./gradlew :phone-app:assembleDebug :glasses-app:assembleDebug --stacktrace
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: clawsses-debug-apks
          path: |
            phone-app/build/outputs/apk/debug/*.apk
            glasses-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
